<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>הצופן התנכי · CodeNest</title>
<meta name="description" content="חיפוש דילוגי אותיות (ELS) בתורה, בתנ״ך ובברית החדשה — שמות, מטריצות וקריאה אנכית, עם בדיקת ביקורת כנה.">
<meta name="theme-color" content="#0b0b0c">
<meta property="og:title" content="הצופן התנכי · CodeNest">
<meta property="og:description" content="חיפוש דילוגי אותיות בתורה, בתנ״ך ובברית החדשה — AppNest">
<meta property="og:image" content="icon-512.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--acc:#d4af37;--acc2:#f3d77a;--bg:#0b0b0c;--card:#141416;--card2:#1b1b1f;--line:#2c2c31;--txt:#f2efe6;--mut:#a29f96;--hl1:#d4af37;--hl2:#4fc3f7;--hl3:#ef6f8f;--hl4:#7ed37a;--hl5:#c18cff;--danger:#e5484d;--ok:#3ecf8e}
[data-theme=sapphire]{--acc:#7fb3ff;--acc2:#bcd6ff}
[data-theme=emerald]{--acc:#3ecf8e;--acc2:#9de8c4}
[data-theme=ruby]{--acc:#e0607e;--acc2:#f3a9ba}
[data-theme=parchment]{--acc:#c8a165;--acc2:#e6cfa5}
[data-mode=light]{--bg:#f6f3ea;--card:#fffdf8;--card2:#f0ece0;--line:#d8d2c2;--txt:#1d1b16;--mut:#6c675b}
[data-mode=light][data-theme=gold]{--acc:#a5801a;--hl1:#a5801a}
[data-mode=light][data-theme=sapphire]{--acc:#2f6fd0}
[data-mode=light][data-theme=emerald]{--acc:#16895a}
[data-mode=light][data-theme=ruby]{--acc:#b8324f}
[data-mode=light][data-theme=parchment]{--acc:#8b6a33}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.5}
body{padding-bottom:env(safe-area-inset-bottom)}
.heb{font-family:"Frank Ruehl CLM","David Libre","David","Times New Roman",FreeSerif,serif}
button,input,select,textarea{font:inherit;color:inherit}
header#hdr{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));min-height:56px}
#hdr .ttl{flex:1;font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hdr .ttl small{color:var(--acc);font-weight:600}
@media(max-width:430px){#hdr .ttl small{display:none}#hdr .ib{min-width:36px;padding:0 7px}}
.ib{background:transparent;border:1px solid var(--line);border-radius:10px;min-width:40px;height:40px;padding:0 10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.ib:active{transform:scale(.96)}
#backBtn{border-color:var(--acc);color:var(--acc);font-weight:600;max-width:46%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.dot{width:10px;height:10px;border-radius:50%;background:#666;display:inline-block}
.dot.on{background:var(--ok)}.dot.off{background:var(--danger)}
main{max-width:760px;margin:0 auto;padding:14px 12px 40px}
.sc{display:none;animation:fade .18s ease}
.sc.on{display:block}
@keyframes fade{from{opacity:.3;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:17px;color:var(--acc)}
.mut{color:var(--mut);font-size:14px}
.big{display:flex;align-items:center;gap:14px;width:100%;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:10px;cursor:pointer}
.big .ic{font-size:28px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:1px solid var(--acc);border-radius:12px;color:var(--acc);flex:none}
.big b{display:block;font-size:17px}
.big span{color:var(--mut);font-size:14px}
.big:active{border-color:var(--acc)}
.btn{background:transparent;border:1.5px solid var(--acc);color:var(--acc);border-radius:12px;padding:10px 16px;cursor:pointer;font-weight:600;min-height:44px}
.btn.pri{background:var(--acc);color:#111;border-color:var(--acc)}
[data-mode=light] .btn.pri{color:#fff}
.btn.sm{padding:6px 10px;min-height:36px;font-size:14px;border-radius:10px}
.btn.dng{border-color:var(--danger);color:var(--danger)}
.btn:disabled{opacity:.45}
.btn.wide{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:1 1 auto}
.fld{margin-bottom:10px}
.fld label{display:block;font-size:14px;color:var(--mut);margin-bottom:4px}
input[type=text],input[type=number],input[type=password],input[type=url],select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:44px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
.word-in{font-size:22px;text-align:center;letter-spacing:2px}
.chk{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:15px}
.chk input{width:20px;height:20px;accent-color:var(--acc)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--card2);cursor:pointer;font-size:14px}
.chip.on{border-color:var(--acc);color:var(--acc);font-weight:700}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stat div{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--acc)}
.stat span{font-size:12px;color:var(--mut)}
.verdict{border-inline-start:3px solid var(--acc);padding:6px 10px;background:var(--card2);border-radius:8px;font-size:15px}
.res{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid var(--line);cursor:pointer}
.res:last-child{border-bottom:0}
.res .sk{min-width:64px;text-align:center;font-weight:700;color:var(--acc);border:1px solid var(--line);border-radius:10px;padding:4px}
.res .rf{flex:1;font-size:15px}
.res .rf small{display:block;color:var(--mut)}
.pbar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin:10px 0}
.pbar i{display:block;height:100%;width:0;background:var(--acc);transition:width .15s}
mark{background:transparent;color:var(--acc);font-weight:800;border-bottom:2px solid var(--acc)}
.verse{font-size:19px;line-height:1.9;margin:4px 0 10px}
.verse .hit{background:var(--acc);color:#111;border-radius:4px;padding:0 2px;font-weight:800;animation:pop .45s both}
@keyframes pop{0%{background:transparent;color:inherit;transform:scale(1)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
.explain{font-size:16px;line-height:1.6;margin:4px 0 10px}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:6px 0;font-size:22px}
.chain b{display:inline-flex;align-items:center;justify-content:center;width:38px;height:42px;border-radius:10px;background:var(--acc);color:#111;animation:pop .45s both}
.chain .jmp{display:inline-flex;flex-direction:column;align-items:center;color:var(--acc);font-size:16px;line-height:1;animation:fadein .3s both}
.chain .jmp small{font-size:11px;color:var(--mut)}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.help{border-color:var(--acc)}.help .hb{font-size:15px;line-height:1.65}.help .hb b{color:var(--acc)}
@media (prefers-reduced-motion:reduce){.verse .hit,.chain b,.chain .jmp{animation:none}}
.seq{font-size:20px;line-height:2;word-break:break-all;letter-spacing:1px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px;max-height:46vh;overflow:auto}
.seq mark{cursor:pointer}
.wl{display:flex;flex-wrap:wrap;gap:6px}
.wl .chip b{color:var(--acc)}
/* matrix */
.mxwrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card2);max-height:62vh;-webkit-overflow-scrolling:touch}
.mx{display:grid;gap:1px;padding:6px;width:max-content;margin:0 auto}
.mx div{width:var(--cs,26px);height:calc(var(--cs,26px) + 2px);display:flex;align-items:center;justify-content:center;font-size:calc(var(--cs,26px)*.72);border-radius:5px;cursor:pointer;user-select:none}
.stepper{display:flex;gap:6px}.stepper .btn{flex:0 0 52px;padding:0}.stepper input{flex:1;text-align:center}
.mx div.e{opacity:.15}
.mx .h1{background:var(--hl1);color:#111;font-weight:800}
.mx .h2{background:var(--hl2);color:#111;font-weight:800}
.mx .h3{background:var(--hl3);color:#111;font-weight:800}
.mx .h4{background:var(--hl4);color:#111;font-weight:800}
.mx .h5{background:var(--hl5);color:#111;font-weight:800}
.mx .vb{box-shadow:inset 0 0 0 1px var(--line)}
.lg{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;font-size:14px}
.lg i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:middle;margin-inline-end:4px}
.navpad{display:flex;gap:6px;justify-content:center;margin:8px 0;flex-wrap:wrap}
/* overlays */
#ovl .bk{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:flex;align-items:flex-end;justify-content:center}
#ovl .md{background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;width:100%;max-width:760px;max-height:88vh;overflow:auto;padding:16px 16px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease}
@media(min-width:700px){#ovl .bk{align-items:center}#ovl .md{border-radius:18px;border-bottom:1px solid var(--line)}}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.md h3{margin:0 0 10px;color:var(--acc);display:flex;align-items:center;gap:8px}
.md h3 .x{margin-inline-start:auto}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--card2);border:1px solid var(--acc);color:var(--txt);padding:10px 16px;border-radius:12px;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
#busy{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:80;display:none;align-items:center;justify-content:center;padding:20px}
#busy.on{display:flex}
#busy .md{background:var(--card);border:1px solid var(--acc);border-radius:16px;padding:18px;width:100%;max-width:420px;text-align:center}
#guide{position:fixed;inset:0;z-index:70;background:var(--bg);display:none;flex-direction:column;padding:24px 18px calc(24px + env(safe-area-inset-bottom))}
#guide.on{display:flex}
#guide .gbody{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:560px;margin:0 auto;text-align:center}
#guide .gic{font-size:64px;margin-bottom:10px}
#guide h2{color:var(--acc);margin:6px 0}
#guide .dots{display:flex;gap:6px;justify-content:center;margin:16px 0}
#guide .dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
#guide .dots i.on{background:var(--acc)}
.foot{text-align:center;color:var(--mut);font-size:13px;margin-top:20px}
.badge{display:inline-block;border:1px solid var(--acc);color:var(--acc);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.tag{display:inline-block;font-size:11px;border-radius:6px;padding:1px 6px;border:1px solid var(--line);color:var(--mut);margin-inline-start:6px}
.tag.ok{border-color:var(--ok);color:var(--ok)}.tag.rv{border-color:#e9a23b;color:#e9a23b}
.pv{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pv button{height:54px;border-radius:12px;border:2px solid var(--line);cursor:pointer;font-size:12px}
.pv button.on{border-color:var(--txt)}
.ans{white-space:pre-wrap;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:15px;max-height:50vh;overflow:auto}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:center}.tbl th{color:var(--mut);font-weight:600}.tbl td small{display:block;color:var(--mut);font-size:11px}.tbl .hiR{color:var(--acc);font-weight:800}
.yr{margin:8px 0;border:1px solid var(--line);border-radius:12px;padding:8px 10px}.yr summary{cursor:pointer;color:var(--acc);font-weight:600}
#appnest-assistant-panel{z-index:75!important}
#bootfail{display:none;position:fixed;inset:auto 10px 10px;background:#400;color:#fff;padding:12px;border-radius:10px;z-index:99;animation:bf 0s 9s forwards}
@keyframes bf{to{display:block}}
#print{display:none}
@media print{body>*{display:none!important}#print{display:block!important;color:#000;background:#fff;font-family:serif}#print h1{font-size:20px}#print .it{border-bottom:1px solid #999;padding:8px 0}}
</style>
</head>
<body>
<div id="bootfail">⚠️ The app did not finish loading. Check your connection and reload. · האפליקציה לא נטענה עד הסוף — בדקו חיבור ורעננו.</div>
<header id="hdr">
  <button class="ib" id="backBtn" style="display:none"></button>
  <div class="ttl" id="hdrTitle"></div>
  <button class="ib" id="helpBtn" aria-label="help" style="display:none">?</button>
  <button class="ib" id="asstBtn" aria-label="assistant">🪄</button>
  <button class="ib" id="aiDotBtn" aria-label="AI"><i class="dot" id="aiDot"></i><span style="font-size:13px">AI</span></button>
  <button class="ib" id="themeBtn" aria-label="theme">🎨</button>
  <button class="ib" id="aboutBtn" aria-label="about">ℹ️</button>
</header>
<main id="app">
<!-- HOME -->
<section class="sc on" id="sc-home">
  <div class="card" style="text-align:center">
    <div style="font-size:34px;line-height:1" class="heb">הַצֹּפֶן</div>
    <div class="mut" data-t="homeSub"></div>
    <div id="homeHello" style="margin-top:6px;font-weight:600"></div>
  </div>
  <button class="big" data-go="search"><span class="ic">🔍</span><div><b data-t="mSearch"></b><span data-t="mSearchD"></span></div></button>
  <button class="big" data-go="reader"><span class="ic">🔢</span><div><b data-t="mReader"></b><span data-t="mReaderD"></span></div></button>
  <button class="big" data-go="matrix"><span class="ic">▦</span><div><b data-t="mMatrix"></b><span data-t="mMatrixD"></span></div></button>
  <button class="big" data-go="ciphers"><span class="ic">🔤</span><div><b data-t="mCiphers"></b><span data-t="mCiphersD"></span></div></button>
  <button class="big" data-go="pair"><span class="ic">🔗</span><div><b data-t="mPair"></b><span data-t="mPairD"></span></div></button>
  <button class="big" data-go="saved"><span class="ic">★</span><div><b data-t="mSaved"></b><span id="savedCount"></span></div></button>
  <div class="card" id="parCard"></div>
  <div class="card">
    <h3>👤 <span data-t="nameT"></span></h3>
    <div class="mut" data-t="nameD"></div>
    <div class="row" style="margin-top:10px"><input type="text" id="nmIn" class="heb" dir="rtl" style="flex:3" data-tp="namePh"><button class="btn pri" id="nmGo" style="flex:1" data-t="nameGo"></button></div>
  </div>
  <div class="card">
    <h3 data-t="demoT"></h3>
    <div class="mut" data-t="demoD"></div>
    <div class="row" style="margin-top:10px"><button class="btn" id="demoBtn" data-t="demoBtn"></button></div>
  </div>
  <div class="row">
    <button class="btn" data-go="sources" data-t="mSources"></button>
    <button class="btn" data-go="settings" data-t="mSettings"></button>
  </div>
  <div class="foot"><span id="verLbl"></span><br><span class="badge">AppNest</span></div>
</section>

<!-- SEARCH (ELS) -->
<section class="sc" id="sc-search">
  <div class="helpbox" data-help="search"></div>
  <div class="card">
    <div class="fld"><label data-t="wordLbl"></label>
      <input type="text" id="sWord" class="word-in heb" autocomplete="off" dir="rtl" data-tp="wordPh">
      <div class="chips" id="sQuick"></div>
    </div>
    <div class="scope" id="sScope"></div>
    <div class="row">
      <div class="fld"><label data-t="skipMin"></label><input type="number" id="sMin" min="1" value="1" inputmode="numeric"></div>
      <div class="fld"><label data-t="skipMax"></label><input type="number" id="sMax" min="1" value="1000" inputmode="numeric"></div>
    </div>
    <button class="btn sm" id="sGemSkip" style="margin-bottom:6px" data-t="gemSkipQuick"></button>
    <label class="chk"><input type="checkbox" id="sBoth" checked><span data-t="bothDir"></span></label>
    <label class="chk"><input type="checkbox" id="sCtrl" checked><span data-t="ctrlRun"></span></label>
    <button class="btn pri wide" id="sGo" data-t="searchBtn"></button>
  </div>
  <div id="sOut"></div>
</section>

<!-- READER (every N) -->
<section class="sc" id="sc-reader">
  <div class="helpbox" data-help="reader"></div>
  <div class="card">
    <div class="mut" data-t="readerIntro" style="margin-bottom:8px"></div>
    <div class="scope" id="rScope" data-ch="1"></div>
    <div class="row">
      <div class="fld"><label data-t="everyN"></label><input type="number" id="rN" min="1" value="3" inputmode="numeric"></div>
      <div class="fld"><label data-t="startAt"></label><input type="number" id="rStart" min="1" value="1" inputmode="numeric"></div>
      <div class="fld"><label data-t="maxLetters"></label><input type="number" id="rMax" min="10" value="2000" inputmode="numeric"></div>
    </div>
    <label class="chk"><input type="checkbox" id="rBack"><span data-t="readBack"></span></label>
    <button class="btn pri wide" id="rGo" data-t="readBtn"></button>
  </div>
  <div id="rOut"></div>
</section>

<!-- MATRIX -->
<section class="sc" id="sc-matrix">
  <div class="helpbox" data-help="matrix"></div>
  <div class="card" id="mSetup">
    <div class="mut" data-t="matrixIntro" style="margin-bottom:8px"></div>
    <div class="scope" id="mScope" data-ch="1"></div>
    <div class="row">
      <div class="fld"><label data-t="rowWidth"></label><input type="number" id="mW" min="2" max="400" value="22" inputmode="numeric"></div>
      <div class="fld"><label data-t="rowsN"></label><input type="number" id="mR" min="5" max="80" value="24" inputmode="numeric"></div>
    </div>
    <button class="btn pri wide" id="mGo" data-t="buildMatrix"></button>
  </div>
  <div id="mOut"></div>
</section>

<!-- CIPHERS -->
<section class="sc" id="sc-ciphers">
  <div class="helpbox" data-help="ciphers"></div>
  <div class="chips" id="cTabs" style="margin-bottom:10px"></div>
  <div id="cBody"></div>
  <div id="cOut"></div>
</section>

<!-- PAIR -->
<section class="sc" id="sc-pair">
  <div class="helpbox" data-help="pair"></div>
  <div class="card">
    <div class="row">
      <div class="fld"><label data-t="pA"></label><input type="text" id="pA" class="word-in heb" dir="rtl" placeholder="משה"></div>
      <div class="fld"><label data-t="pB"></label><input type="text" id="pB" class="word-in heb" dir="rtl" placeholder="מצרים"></div>
    </div>
    <div class="scope" id="pScope"></div>
    <div class="fld"><label data-t="pMaxL"></label><input type="number" id="pMax" min="2" inputmode="numeric"></div>
    <div class="fld"><label data-t="pModeL"></label><div class="chips" id="pMode"></div></div>
    <details class="yr"><summary>📅 <span data-t="yrT"></span></summary><div class="mut" data-t="yrD" style="margin:6px 0"></div><input type="text" id="yrIn" placeholder="2026 · 5787 · 2026-11-13" dir="ltr"><div id="yrOut"></div></details>
    <label class="chk"><input type="checkbox" id="pCtrl" checked><span data-t="ctrlRun"></span></label>
    <button class="btn pri wide" id="pGo" data-t="pGo"></button>
  </div>
  <div id="pOut"></div>
</section>

<!-- SAVED -->
<section class="sc" id="sc-saved">
  <div class="row" style="margin-bottom:10px">
    <button class="btn sm" id="expPdf">PDF</button>
    <button class="btn sm" id="expCsv">CSV</button>
    <button class="btn sm" id="shareSaved" data-t="share"></button>
  </div>
  <div id="savedList"></div>
</section>

<!-- SOURCES -->
<section class="sc" id="sc-sources"><div id="srcBody"></div></section>

<!-- SETTINGS -->
<section class="sc" id="sc-settings">
  <div class="card">
    <h3 data-t="general"></h3>
    <div class="fld"><label data-t="userName"></label><input type="text" id="stName" data-tp="userNamePh"></div>
    <div class="fld"><label data-t="language"></label>
      <div class="chips" id="stLang"></div></div>
    <div class="fld"><label data-t="themeLbl"></label><div class="pv" id="stTheme"></div></div>
    <div class="chips" id="stMode"></div>
  </div>

  $('gNext').textContent = gi === GSTEPS.length - 1 ? T('start') : T('next');
}
function skipGuide() { $('guide').classList.remove('on'); S.guided = true; saveS(); }

/* ---------- boot ---------- */
var ON_SHOW = {
  search: function () { quickChips(); },
  ciphers: function (o) { if (!o.back) $('cOut').innerHTML = ''; renderCiphers(); }, pair: function () { renderScope('pScope'); renderPairMode(); },
  saved: renderSaved, settings: renderSettings, sources: renderSources, about: renderAbout,
  matrix: function (o) { if (!o.back && !mxOpening) { MX = null; $('mSetup').style.display = ''; $('mOut').innerHTML = ''; } }
};
function boot() {
  applyTheme(); applyLang();
  document.querySelectorAll('[data-go]').forEach(function (b) { b.onclick = function () { showSc(b.getAttribute('data-go')); }; });
  $('backBtn').onclick = goBack;
  $('helpBtn').onclick = showHelpAgain;
  $('asstBtn').onclick = function () { if (window.AppNestAssistant) AppNestAssistant.toggle(); };
  $('themeBtn').onclick = function () { S.theme = THEMES[(THEMES.indexOf(S.theme) + 1) % THEMES.length]; saveS(); applyTheme(); toast('🎨 ' + T('th_' + S.theme)); };
  $('aboutBtn').onclick = function () { showSc('about'); };
  $('aiDotBtn').onclick = function () { showSc('settings'); setTimeout(function () { $('aiCard').scrollIntoView({ behavior: 'smooth' }); }, 120); };
  $('busyCancel').onclick = cancelBusy;
  $('gNext').onclick = function () { if (gi < GSTEPS.length - 1) { gi++; renderGuide(); } else skipGuide(); };
  $('gSkip').onclick = skipGuide;
  $('demoBtn').onclick = function () {
    showSc('search'); $('sWord').value = 'תורה';
    SCOPES.sScope.g = 'torah'; SCOPES.sScope.b = 0; renderScope('sScope');
    $('sMin').value = 2; $('sMax').value = 100; runSearch();
  };
  $('expCsv').onclick = exportCSV; $('expPdf').onclick = exportPDF;
  $('shareSaved').onclick = function () { if (!SAVED.length) { toast(T('noSaved')); return; } shareText(T('mSaved'), savedText()); };
  initSearch(); initReader(); initMatrix(); initSettings(); initAI(); initPair();
  $('nmIn').value = S.name || ''; $('nmGo').onclick = function () { runName(false); }; renderParashaCard();
  $('yrIn').addEventListener('input', renderYearHelper); $('nmIn').addEventListener('keydown', function (e) { if (e.key === 'Enter') runName(); });
  $('sGemSkip').onclick = function () { var w = cleanWord($('sWord').value); if (w.length < 2) { toast(T('wordShort')); return; } var v = gemOf($('sWord').value.replace(/[^\u05D0-\u05EA]/g, ''), false); $('sMin').value = v; $('sMax').value = v; toast(T('gemSet', { v: v })); };
  updSavedCount(); syncHistory();
  if (!S.guided && !/[?&]noguide/.test(location.search)) openGuide();
  var bf = $('bootfail'); if (bf) bf.remove();
  if ('serviceWorker' in navigator && !/[?&]nosw/.test(location.search)) navigator.serviceWorker.register('sw.js').catch(function () { });
  window.__APP_READY = true;
}
boot();

</script>
<script>
/* ═══════════════════════════════════════════════════════════════════════
   CodeNest — מפת עוזר AppNest + "מוח מקומי" שעונה בלי מפתח AI
   המוח מזהה פקודות (חיפוש, גימטריה, אתב"ש, פסוק, פרשה, ספירות…) ומאגר
   שאלות-תשובות. מה שהוא לא יודע — עובר ל-AI אם חובר מפתח, אחרת עונה בכנות.
   ═══════════════════════════════════════════════════════════════════════ */
var BR = (function () {
  function heUI() { return S.lang === 'he'; }
  function L(he, en) { return heUI() ? he : en; }
  function norm(s) {
    return String(s || '').replace(/[֑-ׇ]/g, '').replace(/[״"׳'`]/g, '').replace(/[?!.,;:()\[\]{}…]/g, ' ').replace(/\s+/g, ' ').trim().toLowerCase();
  }
  /* ---- book names (Hebrew + English + common variants) ---- */
  var BOOK_ALIASES = null;
  function bookAliases() {
    if (BOOK_ALIASES) return BOOK_ALIASES;
    var A = [];
    ['tanach', 'nt'].forEach(function (src) {
      BOOKS[src].forEach(function (b, i) {
        var names = [b[1], b[3].toLowerCase()];
        if (b[1].indexOf(' ') > 0) names.push(b[1].replace(' ', ' '));
        A.push({ src: src, i: i, names: names });
      });
    });
    var extra = { 'ישעיה': ['tanach', 11], 'ירמיה': ['tanach', 12], 'תהלים': ['tanach', 26], 'שמואל': ['tanach', 7], 'מלכים': ['tanach', 9], 'דברי הימים': ['tanach', 37], 'שיר השירים': ['tanach', 29], 'מתיא': ['nt', 0], 'מעשים': ['nt', 4], 'התגלות': ['nt', 26], 'חזון יוחנן': ['nt', 26], 'psalm': ['tanach', 26] };
    Object.keys(extra).forEach(function (k) { A.push({ src: extra[k][0], i: extra[k][1], names: [k] }); });
    A.forEach(function (a) { a.names.sort(function (x, y) { return y.length - x.length; }); });
    BOOK_ALIASES = A; return A;
  }
  function findBook(t) {
    var best = null;
    bookAliases().forEach(function (a) { a.names.forEach(function (n) { var p = t.indexOf(n); if (p >= 0 && (!best || n.length > best.n.length)) best = { src: a.src, i: a.i, n: n, pos: p }; }); });
    return best;
  }
  function heToNum(s) { if (/^\d+$/.test(s)) return +s; var v = gemOf(s, false); return v || null; }
  /* ---- answers that need the text ---- */
  function countInfo(scopeKey) {
    var g = scopeKey.g, src = GROUPS[g] ? GROUPS[g][0] : 'tanach';
    return loadCorp(scopeKey.book != null ? scopeKey.src : src).then(function (C) {
      var R = scopeKey.book != null ? { from: C.books[scopeKey.book].l0, to: C.books[scopeKey.book].l1 } : scopeRange(C, { g: g, b: -1 });
      var v0 = verseOf(C, R.from), v1 = verseOf(C, R.to - 1) + 1, words = 0, chs = 0;
      for (var v = v0; v < v1; v++) { if (C.verses[v]) words += C.verses[v].split(' ').length; if (C.vn[v] === 1) chs++; }
      var verses = 0; for (v = v0; v < v1; v++) if (C.verses[v]) verses++;
      return { letters: R.to - R.from, words: words, verses: verses, chapters: chs };
    });
  }
  function wordCount(word, g) {
    var src = GROUPS[g][0];
    return loadCorp(src).then(function (C) {
      var R = scopeRange(C, { g: g, b: -1 }), v0 = verseOf(C, R.from), v1 = verseOf(C, R.to - 1) + 1, u = unfin(word), n = 0, refs = [];
      for (var v = v0; v < v1; v++) { var ws = C.verses[v].split(' '); for (var i = 0; i < ws.length; i++) if (unfin(ws[i]) === u) { n++; if (refs.length < 5) refs.push(refOf(C, C.st[v])); } }
      return { n: n, refs: refs };
    });
  }
  function scopeFromText(t) {
    if (/ברית החדשה|ברית חדשה|new testament|\bnt\b/.test(t)) return 'nt';
    if (/תנך|תנ ך|כל התנ|bible|tanach/.test(t)) return 'tanach';
    if (/נביאים|prophets/.test(t)) return 'neviim';
    if (/כתובים|writings/.test(t)) return 'ketuvim';
    if (/פרשה|parash|parsha/.test(t)) return 'parasha';
    return 'torah';
  }
  function pickWord(raw, after) {
    var m = raw.replace(/[֑-ׇ]/g, '').match(after);
    if (!m) return '';
    var w = (m[1] || '').replace(/["'״׳]/g, '').trim().split(/\s+/)[0] || '';
    return w.replace(/^(את|ה?מילה|ה?שם)$/, '');
  }
  /* ---- knowledge base: [keywords, he, en] ---- */
  var KB = [
    [['דילוג', 'els', 'צופן', 'letter skip', 'skip', 'bible code'], 'דילוג אותיות (ELS) פירושו: מורידים מהטקסט רווחים וניקוד, ומחפשים את אותיות המילה במרחק שווה זו מזו. למשל "תורה" מופיעה בבראשית כשמתחילים מה-ת׳ הראשונה וסופרים כל 50 אותיות: ת…ו…ר…ה. המרחק (50) נקרא "דילוג".', 'An equidistant letter sequence (ELS): remove spaces and vowels, then look for the word\'s letters at an equal distance. E.g. "תורה" appears in Genesis starting at the first ת and taking every 50th letter. The distance (50) is the "skip".'],
    [['שלושה מספרים', 'המספרים', 'מעורבב', 'צפוי', 'בטקסט המעורבב', 'shuffled', 'expected', 'three numbers'], 'בתוצאות יש שלושה מספרים: כמה פעמים המילה נמצאה בטקסט האמיתי; כמה בממוצע בטקסטים מעורבבים (אותן אותיות בסדר אקראי); וכמה צפוי במקרה לפי שכיחות האותיות. אם האמיתי דומה לשניים האחרים — הממצא לא מיוחד. אם הוא הרבה מעל — כתוב כמה נדיר הוא ("בערך 1 ל-…").', 'Three numbers: hits in the real text; average hits in shuffled texts (same letters, random order); and the number expected by chance from letter frequencies. If the real number is close to the others, the finding is not special; if far above, the app says how rare it is.'],
    [['ביקורת', 'מקרי', 'סטטיסטיק', 'הוכחה', 'אמיתי', 'זה נכון', 'נבואה', 'באמת', 'מדעי', 'proof', 'real', 'statistic', 'chance', 'random'], 'בכנות: בכל טקסט ארוך אפשר למצוא כמעט כל מילה קצרה באיזשהו דילוג — גם ב"מלחמה ושלום". לכן האפליקציה משווה תמיד לטקסטים מעורבבים ומחשבת כמה סביר שהממצא מקרי. ממצא נדיר הוא מעניין, אבל אם בודקים הרבה שמות — חלק ייצאו נדירים במקרה. זה לא שולל משמעות אישית, אבל זו לא הוכחה.', 'Honestly: in any long text almost any short word can be found at some skip — even in War and Peace. So the app always compares with shuffled texts and estimates how likely a finding is by chance. A rare finding is interesting, but if you test many names some will look rare by chance. Not proof.'],
    [['ויצטום', 'ריפס', 'רוזנברג', 'מחקר', 'מקיי', 'דרוסנין', 'witztum', 'rips', 'mckay', 'drosnin', 'study'], 'המחקר המפורסם: דורון ויצטום, אליהו ריפס ויואב רוזנברג פרסמו ב-1994 בכתב העת Statistical Science מאמר על צירופים של שמות חכמים ותאריכים בספר בראשית. ב-1999 פרסמו ברנדן מקיי ועמיתיו תשובה, שבה הראו תוצאות דומות ב"מלחמה ושלום" וטענו שהבחירות בנתונים השפיעו על התוצאה. הוויכוח לא הוכרע לטובת הצופן בקהילה המדעית. מיכאל דרוסנין פרסם את "צופן התנ״ך" ב-1997 והפך את הנושא לפופולרי.', 'The famous study: Witztum, Rips and Rosenberg published in Statistical Science (1994) a paper on names of sages and dates in Genesis. In 1999 Brendan McKay and colleagues replied, finding similar results in War and Peace and arguing that data choices drove the result. The scientific community did not accept the code. Michael Drosnin\'s "The Bible Code" (1997) popularized it.'],
    [['מטריצה', 'טבלה', 'אנכית', 'עמודה', 'matrix', 'grid', 'vertical', 'column'], 'במטריצה הטקסט נכתב בשורות באורך קבוע. כשרוחב השורה שווה לדילוג, המילה שנמצאה עומדת בעמודה מלמעלה למטה. אפשר לשנות רוחב (− / +), לחפש מילים נוספות בכל 8 הכיוונים, וללחוץ על אות כדי לראות את הפסוק שלה. כפתור 📷 יוצר תמונה לשיתוף.', 'In the matrix the text is written in rows of fixed width. When the width equals the skip, the word stands in a column. Change the width, search more words in 8 directions, tap a letter for its verse. 📷 makes a shareable image.'],
    [['כל אות', 'אות שלישית', 'כל אות n', 'every', 'nth'], 'במסך "כל אות N" בוחרים טקסט ומספר: עם 3 לוקחים את האות הראשונה, ואז כל אות שלישית. הרצף נכתב ברצף, ומילים שנוצרות בו מסומנות. אפשר גם לבקש ממני: "כל אות 3 בשמות".', '"Every Nth letter": pick a text and a number. With 3 you take the first letter, then every third. Words formed in the sequence are marked. Or ask me: "every 3rd letter in Exodus".'],
    [['גימטריה', 'gematria', 'ערך מספרי'], 'גימטריה: לכל אות ערך (א=1 … י=10, כ=20 … ק=100 … ת=400), ומחברים. אפשר לשאול אותי "מה הגימטריה של שלום", או לפתוח את המסך "גימטריה וצפנים" — שם רואים גם מילים ופסוקים עם אותו ערך, ואפשר לחפש את המילה בדילוג ששווה לגימטריה שלה.', 'Gematria: every letter has a value (א=1 … י=10, כ=20 … ק=100 … ת=400), and you add them. Ask me "gematria of שלום", or open "Gematria & ciphers" for words and verses with the same value.'],
    [['אתבש', 'אלבם', 'atbash', 'albam', 'ששך', 'בבל'], 'אתב״ש: מחליפים את האות הראשונה באחרונה (א↔ת, ב↔ש, ג↔ר…). אלב״ם: חצי האלף-בית הראשון מתחלף בשני (א↔ל, ב↔מ…). בירמיהו כה:כו "ששך" הוא "בבל" באתב״ש. שאלו אותי "אתבש של ששך", או פתחו את המסך לסריקה של פרק שלם.', 'Atbash swaps first and last letters (א↔ת, ב↔ש…); albam swaps the two halves (א↔ל, ב↔מ…). In Jeremiah 25:26 "ששך" is "בבל" in atbash. Ask me "atbash of ששך".'],
    [['ראשי תיבות', 'סופי תיבות', 'ראשי פסוקים', 'acronym', 'initials'], 'ראשי תיבות: לוקחים את האות הראשונה של כל מילה (או פסוק) וכותבים ברצף. בראשית א:א — בבאאהוה. במסך "גימטריה וצפנים" ← "ראשי תיבות" אפשר גם סופי תיבות וראשי/סופי פסוקים, ולחפש מילה בתוך הרצף.', 'Acronyms: take the first letter of every word (or verse) in a row. Genesis 1:1 gives בבאאהוה. Also word finals and verse initials/finals in "Gematria & ciphers".'],
    [['מילה נסתרת', 'נסתר', 'בין מילים', 'hidden'], 'מילה נסתרת היא מילה שכתובה ברצף בטקסט, אבל מתחילה במילה אחת ונגמרת בבאה — כך שבקריאה רגילה לא רואים אותה. במסך "גימטריה וצפנים" ← "מילה נסתרת".', 'A hidden word is written continuously but starts in one word and ends in the next. See "Gematria & ciphers" → "Hidden word".'],
    [['זוג', 'קרוב', 'קרבה', 'שתי מילים', 'pair', 'close', 'proximity'], 'זוג מילים: מחפשים שתי מילים (שם ומקום, שם ושנה) ובודקים כמה קרוב הן בטבלה. זו השיטה של המחקרים. האפליקציה מריצה את אותו חיפוש גם על עד 10 טקסטים מעורבבים ומראה בכמה מהם יצאה קרבה דומה. אפשר לבקש ממני: "משה ליד מצרים".', 'Word pairs: search two words and check how close they are in the grid — the method of the studies. The app repeats it on up to 10 shuffled texts. Ask me: "משה near מצרים".'],
    [['שנה', 'תאריך', 'תשפ', 'year', 'date'], 'שנים ותאריכים: במסך "זוג מילים" יש מחשבון — כותבים 2026 ומקבלים תשפו/תשפז (תלוי בחודש), או תאריך מלא (2026-11-13) ומקבלים את התאריך העברי. אפשר גם לשאול אותי "איך כותבים 2026 בעברית".', 'Years & dates: the "Word pairs" screen has a converter — 2026 gives תשפו/תשפז, a full date gives the Hebrew date. Or ask me "2026 in Hebrew".'],
    [['יוונית', 'greek', 'מקור', 'original'], 'הברית החדשה נכתבה ביוונית, ולכן יש באפליקציה גם את המקור היווני (Textus Receptus). מקלידים באותיות יווניות — אפשר עם סימנים, למשל Ἰησοῦς — והאפליקציה מנקה אותם. בתרגום העברי, כל דילוג תלוי במילים שבחר המתרגם.', 'The New Testament was written in Greek, so the app includes the Greek original (Textus Receptus). Type Greek letters — accents are fine (Ἰησοῦς).'],
    [['נוסח', 'קורן', 'לנינגרד', 'כתיב', 'קרי', 'koren', 'leningrad', 'version'], 'הנוסח: תורה ותנ״ך לפי כתב יד לנינגרד (WLC), כתיב ולא קרי, בלי ניקוד וסימני פרשה. בתורה 304,850 אותיות. המחקרים השתמשו בנוסח קורן (304,805 אותיות) — לכן ממצאים מפורסמים יכולים להיראות אחרת. הברית החדשה בעברית — תרגום דליטש (נחלת הכלל).', 'Text: Leningrad Codex (WLC), ketiv not qere, no vowels or paragraph marks — 304,850 letters in the Torah. The studies used Koren (304,805), so famous findings may differ. Hebrew NT: Delitzsch translation (public domain).'],
    [['סופיות', 'ך', 'ם', 'final'], 'אותיות סופיות (ך ם ן ף ץ) נחשבות כרגילות בחיפוש, כמו שנהוג. אפשר להפעיל הבחנה בהגדרות ← חיפוש.', 'Final letters (ך ם ן ף ץ) count as regular letters, as usual. You can change it in Settings → Search.'],
    [['שמור', 'שמירה', 'ממצאים', 'save', 'saved', 'findings'], 'בכל תוצאה ובכל מטריצה יש כפתור ★ שמור. הממצאים נמצאים במסך "הממצאים שלי", עם הערות, ייצוא ל-PDF ול-CSV ושיתוף.', 'Every result and matrix has ★ Save. Findings live in "My findings", with notes, PDF/CSV export and sharing.'],
    [['גיבוי', 'שחזור', 'backup', 'restore', 'מחיקה', 'delete'], 'גיבוי ושחזור: הגדרות ← נתונים וגיבוי. הקובץ כולל ממצאים והגדרות (בלי מפתח ה-AI). שם גם "מחיקת הכל" עם אישור כפול.', 'Backup & restore: Settings → Data & backup. The file has findings and settings (not the AI key). "Delete everything" is there too.'],
    [['מפתח', 'בינה', 'ai', 'key', 'gemini', 'claude', 'chatgpt'], 'אני עונה על הרבה דברים גם בלי מפתח. מפתח AI (לא חובה) מוסיף הסבר חופשי לממצאים ותשובות לשאלות פתוחות. Gemini נותן מפתח חינמי: הגדרות ← בינה מלאכותית ← Gemini, ושם יש הוראות.', 'I answer many things without a key. An AI key (optional) adds free-form explanations. Gemini has a free key: Settings → AI → Gemini, with instructions.'],
    [['התקנה', 'להתקין', 'אופליין', 'בלי אינטרנט', 'install', 'offline'], 'אפשר להתקין את האפליקציה מהדפדפן ("הוסף למסך הבית"). אחרי הפתיחה הראשונה היא עובדת גם בלי אינטרנט — הטקסטים שמורים במכשיר.', 'Install from the browser ("Add to home screen"). After the first open it works offline — the texts are stored on the device.'],

  appDescription: 'אפליקציה לחיפוש דילוגי אותיות (ELS) בתורה, בתנ״ך ובברית החדשה (עברית ויוונית), עם גימטריה, אתב״ש, ראשי תיבות, מילים נסתרות, זוג מילים קרובות ופרשת השבוע. כל חיפוש מושווה לטקסטים מעורבבים. היה כן: ממצאי דילוגים אינם הוכחה או נבואה; בכל טקסט ארוך יש צירופים מקריים.',
  tabs: [{ name: 'חיפוש', screen: 'search' }, { name: 'כל אות N', screen: 'reader' }, { name: 'מטריצה', screen: 'matrix' }, { name: 'גימטריה וצפנים', screen: 'ciphers' }, { name: 'זוג מילים', screen: 'pair' }, { name: 'הממצאים שלי', screen: 'saved' }, { name: 'הגדרות', screen: 'settings' }, { name: 'מקורות', screen: 'sources' }],
  fields: [],
  navigate: function (screen) { AppNestAssistant.close(); showSc(screen); },
  readAiConfig: function () { return aiReady() ? { provider: S.ai.prov } : null; },
  callAI: function (prompt) { return aiCall(prompt); },
  readState: function () {
    var o = 'מסך: ' + curSc;
    if (LAST) o += '\nחיפוש אחרון: "' + LAST.word + '" ב' + LAST.scLbl + ' — ' + LAST.count + ' בטקסט, ' + (LAST.ctrl == null ? '—' : LAST.ctrl) + ' במעורבב, ' + (Math.round(LAST.exp * 10) / 10) + ' צפוי.';
    if (MX && curSc === 'matrix') o += '\nמטריצה: ' + MX.title + ', רוחב ' + MX.W;
    return o;
  },
  actions: {
    search: { desc: 'חיפוש מילה בדילוגים', args: '{word, scope: torah|neviim|ketuvim|tanach|nt|grc|parasha, min, max}', run: function (a) { AppNestAssistant.close(); gotoSearch(a.word || '', a.scope || 'torah', a.min || 1, a.max || S.maxSkip); return 'מחפש…'; } },
    gematria: { desc: 'פתיחת מסך גימטריה עם מילה', args: '{word}', run: function (a) { AppNestAssistant.close(); showSc('ciphers'); CTAB = 'gem'; renderCiphers(); $('gIn').value = a.word || ''; runGem(); return 'פתחתי.'; } }
  },
  ui: { noFab: true, panelBottom: '16px', panelH: '520px' },
  chipsFill: false,
  welcome: function () { return S.lang === 'he' ? 'היי! אני העוזר של הצופן 🪄 אני עונה גם בלי מפתח AI: אפשר לבקש חיפוש, גימטריה, אתב״ש, פסוק, פרשת השבוע, ספירות — או לשאול איך משהו עובד.' : 'Hi! I\'m the Bible Code assistant 🪄 I work without an AI key too: ask for a search, gematria, atbash, a verse, this week\'s portion, counts — or how something works.'; },
  suggestions: function () { return BR.sugg(); },
  localBrain: function (msg, ctx) { return BR.brain(msg, ctx); },
  onToggle: function (open) { disarmExit(); syncHistory(); }
};

</script>
<script src="appnest-assistant.js?v=3.0"></script>
</body>
